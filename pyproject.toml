[project]
name = "vrtools"
version = "0.1.1"
description = "Virtua Racing Extended: build the arcade Virtua Racing with the Saturn port's seven courses from your own copies"
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[project.scripts]
vrtools = "vrtools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vrtools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
